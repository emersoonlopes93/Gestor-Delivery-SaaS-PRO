title = "Gestor Delivery secret scanning policy"

[extend]
useDefault = true

[[rules]]
id = "gestor-jwt-env-assignment"
description = "JWT signing secret in an environment assignment"
regex = '''(?i)\bJWT_(?:REFRESH_)?SECRET\s*=\s*["']?([A-Za-z0-9+/=]{32,})'''
secretGroup = 1
entropy = 3.0
keywords = ["jwt_secret", "jwt_refresh_secret"]

[[allowlists]]
description = "Documented synthetic marketplace credential examples"
targetRules = ["generic-api-key"]
paths = [
  '''^apps/api/docs/marketplace-ifood-p1-smoke\.md$''',
]

[[allowlists]]
description = "Synthetic commercial AI certification fixture"
targetRules = ["generic-api-key"]
paths = [
  '''^apps/api/scripts/e2e-certification-commercial-ai\.ts$''',
]

[[allowlists]]
description = "Documented Authorization header placeholders"
targetRules = ["curl-auth-header"]
paths = [
  '''^docs/evolution-go/events-system\.md$''',
  '''^docs/evolution-go/api-overview\.md$''',
]
