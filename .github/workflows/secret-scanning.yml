name: Secret scanning

on:
  pull_request:
  push:
    branches: [main-copy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (PR additions and HEAD)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6, pinned to immutable commit d23441a48e516b6c34aea4fa41551a30e30af803.
      - name: Checkout PR diff and HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify controlled synthetic detector
        run: node scripts/test-secret-scanner-negative.js
      # Gitleaks v8.30.0, pinned to immutable OCI digest sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9.
      - name: Scan tracked HEAD with redaction
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -xf - -C "$scan_dir"
          docker run --rm \
            --mount type=bind,source="$scan_dir",target=/repo,readonly \
            --workdir /repo \
            zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            dir --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 /repo
      - name: Scan added PR lines with redaction
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" |
          awk '/^\+[^+]/ { print substr($0, 2) }' |
          docker run --rm -i
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly
          --workdir /repo
          zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          stdin --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  history-audit:
    name: Gitleaks (controlled history audit)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6, pinned to immutable commit d23441a48e516b6c34aea4fa41551a30e30af803.
      - name: Checkout complete history for E0H inventory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan historical refs with redaction
        continue-on-error: true
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly
          --workdir /repo
          zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="--all" /repo
