name: Secret scanning

on:
  pull_request:
  push:
    branches: [main-copy]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks (PR diff and HEAD)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # actions/checkout v6, pinned to immutable commit d23441a48e516b6c34aea4fa41551a30e30af803.
      - name: Checkout PR diff and HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify controlled synthetic detector
        run: node scripts/test-secret-scanner-negative.js
      # gitleaks-action v3, pinned to immutable commit e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e.
      - name: Scan tracked PR diff and HEAD
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  history-audit:
    name: Gitleaks (controlled history audit)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # actions/checkout v6, pinned to immutable commit d23441a48e516b6c34aea4fa41551a30e30af803.
      - name: Checkout complete history for E0H inventory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan historical refs with redaction
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
