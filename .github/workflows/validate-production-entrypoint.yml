name: Validate production entrypoint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main-copy
    paths:
      - ".github/workflows/validate-production-entrypoint.yml"
      - "apps/api/**"
      - "docker-compose.prod.yml"
      - "docker-compose.entrypoint-test.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  validate-entrypoint:
    name: Ephemeral PostgreSQL proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: gestor-entrypoint-ci
      DATABASE_URL: postgresql://gestor:gestor@ephemeral-postgres:5432/gestor_test?schema=public
      DIRECT_URL: postgresql://gestor:gestor@ephemeral-postgres:5432/gestor_test?schema=public
      NODE_ENV: production
      CLEAN_DB: "false"
      MARKETPLACE_IFOOD_BIDIRECTIONAL_ENABLED: "false"
      MARKETPLACE_IFOOD_POLLING_FALLBACK_ENABLED: "false"
      REDIS_ENABLED: "false"
      BULLMQ_ENABLED: "false"

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated Compose override
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml" <<'EOF'
          services:
            api:
              image: gestor-entrypoint-ci-api:local
              restart: "no"
              env_file: !reset []
              environment:
                DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
                DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
                NODE_ENV: ${NODE_ENV}
                CLEAN_DB: ${CLEAN_DB}
                MARKETPLACE_IFOOD_BIDIRECTIONAL_ENABLED: ${MARKETPLACE_IFOOD_BIDIRECTIONAL_ENABLED}
                MARKETPLACE_IFOOD_POLLING_FALLBACK_ENABLED: ${MARKETPLACE_IFOOD_POLLING_FALLBACK_ENABLED}
                REDIS_ENABLED: ${REDIS_ENABLED}
                BULLMQ_ENABLED: ${BULLMQ_ENABLED}
                JWT_SECRET: ci-ephemeral-not-a-production-secret
                JWT_REFRESH_SECRET: ci-ephemeral-not-a-production-refresh-secret
              ports:
                - "127.0.0.1:3333:3333"
              depends_on:
                ephemeral-postgres:
                  condition: service_healthy

            api-migrate:
              image: gestor-entrypoint-ci-api:local
              env_file: !reset []
              environment:
                DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
                DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
                NODE_ENV: ${NODE_ENV}
                CLEAN_DB: ${CLEAN_DB}
                MARKETPLACE_IFOOD_BIDIRECTIONAL_ENABLED: ${MARKETPLACE_IFOOD_BIDIRECTIONAL_ENABLED}
                MARKETPLACE_IFOOD_POLLING_FALLBACK_ENABLED: ${MARKETPLACE_IFOOD_POLLING_FALLBACK_ENABLED}
                REDIS_ENABLED: ${REDIS_ENABLED}
                BULLMQ_ENABLED: ${BULLMQ_ENABLED}
                JWT_SECRET: ci-ephemeral-not-a-production-secret
                JWT_REFRESH_SECRET: ci-ephemeral-not-a-production-refresh-secret

            ephemeral-postgres:
              image: postgres:16-alpine
              hostname: ephemeral-postgres
              environment:
                POSTGRES_USER: gestor
                POSTGRES_PASSWORD: gestor
                POSTGRES_DB: gestor_test
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U gestor -d gestor_test"]
                interval: 2s
                timeout: 3s
                retries: 30

          networks:
            cpnet-attach:
              external: false
              internal: true
              name: gestor-entrypoint-ci-net
          EOF

      - name: Confirm isolated configuration
        shell: bash
        run: |
          echo "Database host: ephemeral-postgres"
          echo "Database name: gestor_test"
          docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml" config --quiet
          rendered_config="$RUNNER_TEMP/docker-compose.entrypoint-ci.rendered.yml"
          docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml" config > "$rendered_config"
          if grep -Eq '^[[:space:]]*env_file:' "$rendered_config" || \
            grep -Fq '.env' "$rendered_config" || \
            grep -Fq 'CLEAN_DB: "true"' "$rendered_config"; then
            echo "Rendered Compose configuration is not isolated."
            exit 1
          fi
          if ! grep -Fq 'DATABASE_URL: postgresql://gestor:gestor@ephemeral-postgres:5432/gestor_test?schema=public' "$rendered_config" || \
            ! grep -Fq 'DIRECT_URL: postgresql://gestor:gestor@ephemeral-postgres:5432/gestor_test?schema=public' "$rendered_config"; then
            echo "Rendered Compose configuration does not use the expected ephemeral database."
            exit 1
          fi

      - name: Build and inspect the API image
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml")
          "${compose[@]}" build api > "$RUNNER_TEMP/api-image-build.log" 2>&1

          if grep -Fq "Environment variables loaded from .env" "$RUNNER_TEMP/api-image-build.log"; then
            echo "The Docker build loaded an .env file."
            exit 1
          fi

          docker run --rm --entrypoint sh gestor-entrypoint-ci-api:local -ec '
            test -x ./docker-entrypoint.sh
            test -f ./dist/apps/api/src/main.js
            test -f ./prisma/schema.prisma
            test -n "$(find ./prisma/migrations -name migration.sql -print -quit)"
            test ! -e ./clean_db.js
            test -z "$(find /app -name .env -print -quit)"
          '
          echo "API image structure verified."

      - name: Start ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml" up -d --wait ephemeral-postgres

      - name: Verify normal startup does not migrate
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml")
          "${compose[@]}" up -d api
          sleep 10
          "${compose[@]}" logs --no-color api > "$RUNNER_TEMP/api-before-migration.log" 2>&1 || true

          assert_absent() {
            if grep -Fqi "$1" "$2"; then
              echo "Forbidden API log pattern detected: $1"
              exit 1
            fi
          }
          for pattern in "migrate deploy" "Applying migration" "DROP SCHEMA" "clean_db" "postgresql://" "DATABASE_URL=" "DIRECT_URL=" "password"; do
            assert_absent "$pattern" "$RUNNER_TEMP/api-before-migration.log"
          done

          api_id=$("${compose[@]}" ps -aq api)
          test -n "$api_id"
          api_running=$(docker inspect -f '{{.State.Running}}' "$api_id")
          if [ "$api_running" != "true" ]; then
            api_exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$api_id")
            test "$api_exit_code" -ne 0
            if ! grep -Eiq 'P2021|does not exist|relation.*does not exist' "$RUNNER_TEMP/api-before-migration.log"; then
              echo "API exited before migrations without an expected empty-schema error."
              exit 1
            fi
          fi

          before_count=$("${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -Atc "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public' AND tablename = '_prisma_migrations';")
          test "$before_count" = "0"
          "${compose[@]}" stop api || true
          echo "Normal API startup did not apply migrations."

      - name: Run api-migrate manually
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml")
          "${compose[@]}" --profile operations run --rm api-migrate > "$RUNNER_TEMP/api-migrate-first.log" 2>&1

          assert_absent() {
            if grep -Fqi "$1" "$2"; then
              echo "Forbidden migration log pattern detected: $1"
              exit 1
            fi
          }
          for pattern in "postgresql://" "DATABASE_URL=" "DIRECT_URL=" "DROP SCHEMA" "clean_db" "seed" "password"; do
            assert_absent "$pattern" "$RUNNER_TEMP/api-migrate-first.log"
          done

          "${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -v ON_ERROR_STOP=1 -c "CREATE TABLE entrypoint_ci_sentinel (id integer PRIMARY KEY); INSERT INTO entrypoint_ci_sentinel VALUES (1);" >/dev/null
          echo "Manual migration completed."

      - name: Verify api-migrate idempotency
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml")
          "${compose[@]}" --profile operations run --rm api-migrate > "$RUNNER_TEMP/api-migrate-second.log" 2>&1

          assert_absent() {
            if grep -Fqi "$1" "$2"; then
              echo "Forbidden migration log pattern detected: $1"
              exit 1
            fi
          }
          for pattern in "postgresql://" "DATABASE_URL=" "DIRECT_URL=" "DROP SCHEMA" "clean_db" "seed" "password"; do
            assert_absent "$pattern" "$RUNNER_TEMP/api-migrate-second.log"
          done

          migration_total=$("${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -Atc "SELECT count(*) FROM _prisma_migrations;")
          migration_failed=$("${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -Atc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL;")
          last_migration=$("${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -Atc "SELECT migration_name FROM _prisma_migrations ORDER BY finished_at DESC LIMIT 1;")
          sentinel_count=$("${compose[@]}" exec -T ephemeral-postgres psql -U gestor -d gestor_test -Atc "SELECT count(*) FROM entrypoint_ci_sentinel;")

          test "$migration_total" -gt 0
          test "$migration_failed" = "0"
          test "$sentinel_count" = "1"
          echo "Migrations total: $migration_total"
          echo "Migrations failed: $migration_failed"
          echo "Last migration: $last_migration"
          echo "Idempotent migration run preserved the ephemeral sentinel."

      - name: Verify API after manual migration
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml")
          "${compose[@]}" up -d api

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3333/api/v1/health >/dev/null && \
              curl --fail --silent --show-error http://127.0.0.1:3333/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "API health or readiness did not become available."
              exit 1
            fi
            sleep 2
          done

          "${compose[@]}" logs --no-color api > "$RUNNER_TEMP/api-after-migration.log" 2>&1 || true
          assert_absent() {
            if grep -Fqi "$1" "$2"; then
              echo "Forbidden API log pattern detected: $1"
              exit 1
            fi
          }
          for pattern in "migrate deploy" "Applying migration" "DROP SCHEMA" "clean_db" "postgresql://" "DATABASE_URL=" "DIRECT_URL=" "password"; do
            assert_absent "$pattern" "$RUNNER_TEMP/api-after-migration.log"
          done

          api_id=$("${compose[@]}" ps -q api)
          test -n "$api_id"
          test "$(docker inspect -f '{{.State.Running}}' "$api_id")" = "true"
          echo "API process, health and readiness verified after migration."

      - name: Quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm prisma:validate
          pnpm check:no-any
          git diff --check

      - name: Cleanup ephemeral resources
        if: always()
        shell: bash
        run: |
          docker compose --env-file /dev/null -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.prod.yml -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml" down --volumes --remove-orphans --rmi local || true
          docker image rm -f gestor-entrypoint-ci-api:local || true
          rm -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.yml"
          rm -f "$RUNNER_TEMP/docker-compose.entrypoint-ci.rendered.yml"
