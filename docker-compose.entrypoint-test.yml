services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_entrypoint_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_entrypoint_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - cpnet-attach

  api:
    image: gestor-entrypoint-test-api:local
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      REDIS_ENABLED: "false"
      BULLMQ_ENABLED: "false"

  api-migrate:
    image: gestor-entrypoint-test-api:local
    depends_on:
      postgres-test:
        condition: service_healthy

networks:
  cpnet-attach:
    name: gestor-entrypoint-test-net
    external: false

volumes:
  postgres-test-data:
