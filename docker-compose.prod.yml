services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=CPNET_ATTACH"
      - "traefik.http.routers.gestor-api.rule=Host(`${API_DOMAIN:-api.kigula.dpdns.org}`)"
      - "traefik.http.routers.gestor-api.entrypoints=websecure"
      - "traefik.http.routers.gestor-api.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.gestor-api.service=gestor-api"
      - "traefik.http.services.gestor-api.loadbalancer.server.port=3333"
      - "traefik.http.services.gestor-api.loadbalancer.passHostHeader=true"
    env_file:
      - .env
    environment:
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      NODE_ENV: production
      API_PORT: 3333
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - cpnet-attach

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - operations
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      NODE_ENV: production
    entrypoint: ["npx", "prisma@5.22.0"]
    command: ["migrate", "deploy"]
    networks:
      - cpnet-attach

networks:
  cpnet-attach:
    external: true
    name: cpnet-attach
